<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#0a1a2e"/>
    </linearGradient>
    <linearGradient id="globe" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- Globe circle -->
  <circle cx="32" cy="32" r="20" stroke="url(#globe)" stroke-width="2" fill="none"/>

  <!-- Latitude lines -->
  <ellipse cx="32" cy="32" rx="9" ry="20" stroke="url(#globe)" stroke-width="1.5" fill="none" opacity="0.7"/>
  <line x1="12" y1="32" x2="52" y2="32" stroke="url(#globe)" stroke-width="1.5" opacity="0.7"/>
  <line x1="14" y1="22" x2="50" y2="22" stroke="url(#globe)" stroke-width="1" opacity="0.5"/>
  <line x1="14" y1="42" x2="50" y2="42" stroke="url(#globe)" stroke-width="1" opacity="0.5"/>

  <!-- Glowing dot at top -->
  <circle cx="32" cy="12" r="2.5" fill="url(#accent)" opacity="0.9"/>

  <!-- Network node dots -->
  <circle cx="20" cy="28" r="2" fill="#34d399" opacity="0.8"/>
  <circle cx="44" cy="28" r="2" fill="#3b82f6" opacity="0.8"/>
  <circle cx="32" cy="44" r="2" fill="#60a5fa" opacity="0.8"/>

  <!-- Connector lines between dots -->
  <line x1="20" y1="28" x2="44" y2="28" stroke="url(#accent)" stroke-width="0.8" opacity="0.4"/>
  <line x1="20" y1="28" x2="32" y2="44" stroke="url(#accent)" stroke-width="0.8" opacity="0.4"/>
  <line x1="44" y1="28" x2="32" y2="44" stroke="url(#accent)" stroke-width="0.8" opacity="0.4"/>
</svg>
